[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --reruns 1 --reruns-delay 2
markers =
    api: API-layer tests (tests/api)
    web: Playwright web UI tests (tests/web)
    mobile: BrowserStack mobile tests — requires BROWSERSTACK_* credentials
    integration: cross-layer integration tests (tests/integration)
    security: tenant isolation / security-boundary tests
